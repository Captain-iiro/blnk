# Deployment manifest for Dokploy (https://dokploy.com).
#
# Deploy as a "Docker Compose" service:
#   - Provider: GitHub, repo, branch main, compose path ./docker-compose.dokploy.yaml
#   - Environment tab: POSTGRES_PASSWORD, BLNK_SERVER_SECRET_KEY,
#     BLNK_TOKENIZATION_SECRET (exactly 32 chars), optional BLNK_TYPESENSE_KEY
#   - Domains tab: service "server", container port 5001, HTTPS Let's Encrypt
#
# Config is passed entirely via BLNK_* env vars (no blnk.json / init container).
version: "3.8"

services:
  server:
    build: .
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["blnk migrate up && blnk start"]
    environment:
      BLNK_DATA_SOURCE_DNS: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/blnk?sslmode=disable
      BLNK_REDIS_DNS: redis:6379
      BLNK_TYPESENSE_DNS: typesense:8108
      BLNK_TYPESENSE_KEY: ${BLNK_TYPESENSE_KEY:-blnk-api-key}
      BLNK_SERVER_PORT: "5001"
      BLNK_SERVER_SECURE: "true"
      BLNK_SERVER_SECRET_KEY: ${BLNK_SERVER_SECRET_KEY}
      BLNK_TOKENIZATION_SECRET: ${BLNK_TOKENIZATION_SECRET}
    expose:
      - "5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
    networks:
      - dokploy-network

  worker:
    build: .
    restart: unless-stopped
    entrypoint: ["blnk", "workers"]
    environment:
      BLNK_DATA_SOURCE_DNS: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/blnk?sslmode=disable
      BLNK_REDIS_DNS: redis:6379
      BLNK_TYPESENSE_DNS: typesense:8108
      BLNK_TYPESENSE_KEY: ${BLNK_TYPESENSE_KEY:-blnk-api-key}
      BLNK_SERVER_SECURE: "true"
      BLNK_SERVER_SECRET_KEY: ${BLNK_SERVER_SECRET_KEY}
      BLNK_TOKENIZATION_SECRET: ${BLNK_TOKENIZATION_SECRET}
    expose:
      - "5004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
    networks:
      - dokploy-network

  redis:
    image: redis:7.2.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: blnk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - dokploy-network

  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    command: ["--data-dir", "/data", "--api-key=${BLNK_TYPESENSE_KEY:-blnk-api-key}", "--listen-port", "8108"]
    environment:
      TYPESENSE_MEMORY_USED_MAX_PERCENTAGE: "85"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - typesense_data:/data
    networks:
      - dokploy-network

volumes:
  pg_data:
  typesense_data:
  redis_data:

networks:
  dokploy-network:
    external: true
